<body>
  <main class="badge-shell" id="app-container">
    <section class="brand-panel" aria-label="DevFest badge creator">
      <img class="brand-logo" src="images/icon/badge_logo.png" alt="DevFest Badge Creator" />
      <div class="brand-copy">
        <p class="eyebrow">DevFest 2026</p>
        <h1>Badge Creator</h1>
        <p class="lede">Create print badges from attendee data.</p>
      </div>
    </section>

    <section class="workspace" aria-label="Badge generation workspace">
      <section class="tool-panel upload-panel" aria-labelledby="upload-title">
        <div class="panel-heading">
          <p class="eyebrow">Data</p>
          <h2 id="upload-title">Upload attendee file</h2>
        </div>
        <label for="file-upload" class="file-drop" id="file-drop">
          <span class="file-drop-icon" aria-hidden="true">+</span>
          <span class="file-drop-text">Choose CSV, XLSX, or JSON</span>
          <span class="file-drop-name" id="file-name">No file selected</span>
        </label>
        <input type="file" id="file-upload" accept=".csv,.xlsx,.json" />
        <div class="status-line" id="badge-count-label" aria-live="polite"></div>
        <div class="validation-summary" id="validation-summary" hidden aria-live="polite"></div>
      </section>

      <section class="tool-panel preview-panel" aria-labelledby="preview-title">
        <div class="panel-heading compact-heading">
          <div>
            <p class="eyebrow">Preview</p>
            <h2 id="preview-title">First badge</h2>
          </div>
          <span class="badge-type-pill" id="preview-type">General</span>
        </div>
        <div class="canvas-frame">
          <canvas id="badge-preview" width="1310" height="2048" aria-label="Badge preview"></canvas>
        </div>
      </section>

      <section class="tool-panel actions-panel" aria-labelledby="actions-title">
        <div id="export-section" hidden>
          <div class="panel-heading">
            <p class="eyebrow">Export</p>
            <h2 id="actions-title">Download badges</h2>
          </div>
          <button id="download-btn" class="primary-action" disabled type="button">Download ZIP</button>
          <div id="progress-container" class="progress-container" hidden>
            <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</div>
          </div>
        </div>
        <p class="stat-line"><span id="year"></span> community count: <strong><span id="countSpan">0</span></strong> badges</p>
      </section>
    </section>
  </main>
